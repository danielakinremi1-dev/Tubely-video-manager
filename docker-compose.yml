# Local development services. Start with `docker compose up -d` (or `make up`).
#
# s3: an S3-compatible emulator (adobe/s3mock, Apache 2.0, no account needed).
# The app talks to it via S3_ENDPOINT=http://localhost:9090 with path-style
# addressing, and the browser plays media from
# MEDIA_BASE_URL=http://localhost:9090/tubely-local.
#
# S3Mock doesn't enforce authentication, so every object is publicly
# readable. That's intended here: it only ever runs on your machine. Real AWS
# uses a private bucket behind CloudFront (see docs/ROADMAP.md, Phase 3).
services:
  s3:
    image: adobe/s3mock:5.2.3
    ports:
      - "9090:9090"
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: tubely-local
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    volumes:
      - s3data:/s3mockroot

  # The API itself, in a container: `docker compose --profile app up -d --build`
  # (or `make up-app`). Without the profile, `docker compose up` starts only
  # S3, for running the server with `go run ./cmd/tubely`.
  app:
    profiles: ["app"]
    build: .
    image: tubely:dev
    ports:
      - "8091:8091"
    depends_on:
      - s3
    # Docker sends SIGTERM, then SIGKILL after this. Tubely drains for up to
    # 20s and then aborts what's left (5s), so give it 30s, not the default 10s.
    stop_grace_period: 30s
    environment:
      PLATFORM: dev
      # A local-only default; set JWT_SECRET in your shell to override.
      JWT_SECRET: ${JWT_SECRET:-local-compose-secret-not-for-production}
      S3_BUCKET: tubely-local
      S3_REGION: us-east-1
      # The app reaches S3 by its compose service name...
      S3_ENDPOINT: http://s3:9090
      S3_FORCE_PATH_STYLE: "true"
      # ...but the browser plays media from the host, so public URLs use the
      # published port on localhost.
      MEDIA_BASE_URL: http://localhost:9090/tubely-local
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    volumes:
      - appdata:/data

volumes:
  # Uploaded objects survive `docker compose down`; `docker compose down -v`
  # wipes them.
  s3data:
  # The containerized app's SQLite database.
  appdata:
